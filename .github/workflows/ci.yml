# Security review V3-N7: the Gradle wrapper is checked and the tests run on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: Rdzeń TS i wtyczka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    name: Android (wrapper, rdzeń, aplikacja)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      # Fails when gradle-wrapper.jar is not one Gradle published.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper checks the downloaded distribution against distributionSha256Sum.
      - run: ./gradlew :core:test :app:testDebugUnitTest
